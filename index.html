<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Form Registrasi</title>

    <style>
        body {
            margin: 0;
            font-family: "Times New Roman", Times, serif;
            font-size: 20px;
            background-color: white;
        }

        .container {
            width: 960px;
        }

        h1 {
            font-size: 38px;
            margin-top: 20px;
            margin-bottom: 35px;
        }

        fieldset {
            width: 960px;
            padding: 10px 20px 18px 20px;
            margin-bottom: 38px;
            border: 2px solid #999;
        }

        legend {
            font-size: 25px;
            padding: 0 4px;
        }

        .baris {
            display: grid;
            grid-template-columns: 280px 20px 1fr;
            align-items: center;
            margin: 8px 0;
        }

        .label {
            white-space: nowrap;
        }

        .titik {
            text-align: center;
        }

        input[type="text"],
        input[type="email"],
        input[type="password"],
        input[type="url"] {
            width: 220px;
            height: 32px;
            font-size: 20px;
            padding: 2px 5px;
            box-sizing: border-box;
        }

        textarea {
            width: 400px;
            height: 128px;
            font-family: monospace;
            font-size: 20px;
            padding: 5px;
            box-sizing: border-box;
        }

        select {
            height: 32px;
            font-size: 20px;
        }

        #tanggal {
            width: 55px;
        }

        #bulan {
            width: 135px;
        }

        #tahun {
            width: 80px;
        }

        input[type="file"] {
            font-family: "Times New Roman", Times, serif;
            font-size: 20px;
        }

        input[type="radio"],
        input[type="checkbox"] {
            width: 20px;
            height: 20px;
            vertical-align: middle;
        }

        .jenis-kelamin {
            display: flex;
            align-items: center;
            gap: 3px;
        }

        .tanggal {
            display: flex;
            gap: 6px;
        }

        .kemampuan {
            display: flex;
            align-items: center;
            gap: 5px;
            flex-wrap: nowrap;
        }

        .kemampuan label {
            white-space: nowrap;
        }

        .tombol {
            margin-top: -10px;
        }

        input[type="reset"],
        input[type="submit"],
        input[type="button"] {
            font-family: Arial, Helvetica, sans-serif;
            font-size: 20px;
            padding: 3px 10px;
            margin-right: 4px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Form Registrasi</h1>

    <form action="" method="get">

        <!-- BIODATA -->
        <fieldset>

            <legend>Biodata</legend>

            <div class="baris">
                <div class="label">Nama Mahasiswa</div>
                <div class="titik">:</div>
                <div>
                    <input
                        type="text"
                        name="nama"
                        placeholder="Nama Anda">
                </div>
            </div>


            <div class="baris">
                <div class="label">No Induk Mahasiswa (NIM)</div>
                <div class="titik">:</div>
                <div>
                    <input
                        type="text"
                        name="nim"
                        value="123456789">
                </div>
            </div>

            <div class="baris">
                <div class="label">Alamat Mahasiswa</div>
                <div class="titik">:</div>
                <div>
                    <textarea
                        name="alamat"
                        placeholder="Alamat Anda"></textarea>
                </div>
            </div>


            <div class="baris">
                <div class="label">Tanggal Lahir</div>
                <div class="titik">:</div>

                <div class="tanggal">

                    <select id="tanggal" name="tanggal">
                        <option value="01">01</option>
                        <option value="02">02</option>
                        <option value="03">03</option>
                        <option value="04">04</option>
                        <option value="05">05</option>
                        <option value="06">06</option>
                        <option value="07">07</option>
                        <option value="08">08</option>
                        <option value="09">09</option>
                        <option value="10">10</option>
                        <option value="11">11</option>
                        <option value="12">12</option>
                        <option value="13">13</option>
                        <option value="14">14</option>
                        <option value="15">15</option>
                        <option value="16">16</option>
                        <option value="17">17</option>
                        <option value="18">18</option>
                        <option value="19">19</option>
                        <option value="20">20</option>
                        <option value="21">21</option>
                        <option value="22">22</option>
                        <option value="23">23</option>
                        <option value="24">24</option>
                        <option value="25">25</option>
                        <option value="26">26</option>
                        <option value="27">27</option>
                        <option value="28">28</option>
                        <option value="29">29</option>
                        <option value="30">30</option>
                        <option value="31">31</option>
                    </select>

                    <select id="bulan" name="bulan">
                        <option value="Januari">Januari</option>
                        <option value="Februari">Februari</option>
                        <option value="Maret">Maret</option>
                        <option value="April">April</option>
                        <option value="Mei">Mei</option>
                        <option value="Juni">Juni</option>
                        <option value="Juli">Juli</option>
                        <option value="Agustus">Agustus</option>
                        <option value="September">September</option>
                        <option value="Oktober">Oktober</option>
                        <option value="November">November</option>
                        <option value="Desember">Desember</option>
                    </select>


                    <select id="tahun" name="tahun">
                        <option value="1990">1990</option>
                        <option value="1991">1991</option>
                        <option value="1992">1992</option>
                        <option value="1993">1993</option>
                        <option value="1994">1994</option>
                        <option value="1995">1995</option>
                        <option value="1996">1996</option>
                        <option value="1997">1997</option>
                        <option value="1998">1998</option>
                        <option value="1999">1999</option>
                        <option value="2000">2000</option>
                    </select>

                </div>
            </div>


            <div class="baris">
                <div class="label">Jenis Kelamin</div>
                <div class="titik">:</div>

                <div class="jenis-kelamin">

                    <input
                        type="radio"
                        id="pria"
                        name="jenis_kelamin"
                        value="Pria"
                        checked>

                    <label for="pria">Pria</label>


                    <input
                        type="radio"
                        id="wanita"
                        name="jenis_kelamin"
                        value="Wanita">

                    <label for="wanita">Wanita</label>

                </div>
            </div>


            <div class="baris">
                <div class="label">Upload Foto</div>
                <div class="titik">:</div>

                <div>
                    <input
                        type="file"
                        name="foto">
                </div>
            </div>


            <div class="baris">
                <div class="label">URL Website</div>
                <div class="titik">:</div>

                <div>
                    <input
                        type="url"
                        name="website"
                        placeholder="URL Website Anda">
                </div>
            </div>


            <div class="baris">
                <div class="label">Perguruan Tinggi</div>
                <div class="titik">:</div>

                <div>
                    <input
                        type="text"
                        name="perguruan_tinggi">
                </div>
            </div>

        </fieldset>


        <!-- INFO AKUN -->
        <fieldset>

            <legend>Info Akun</legend>

            <div class="baris">
                <div class="label">Email</div>
                <div class="titik">:</div>

                <div>
                    <input
                        type="email"
                        name="email"
                        placeholder="Email Anda">
                </div>
            </div>


            <div class="baris">
                <div class="label">Username</div>
                <div class="titik">:</div>

                <div>
                    <input
                        type="text"
                        name="username"
                        placeholder="Username Anda">
                </div>
            </div>


            <div class="baris">
                <div class="label">Password</div>
                <div class="titik">:</div>

                <div>
                    <input
                        type="password"
                        name="password"
                        placeholder="Password Anda">
                </div>
            </div>


            <div class="baris">
                <div class="label">Ulangi Password</div>
                <div class="titik">:</div>

                <div>
                    <input
                        type="password"
                        name="ulangi_password"
                        placeholder="Password Anda">
                </div>
            </div>

        </fieldset>


        <!-- KEMAMPUAN DASAR -->
        <fieldset>

            <legend>Kemampuan Dasar</legend>

            <div class="kemampuan">

                <label>
                    <input
                        type="checkbox"
                        name="kemampuan"
                        value="HTML">
                    HTML
                </label>

                <label>
                    <input
                        type="checkbox"
                        name="kemampuan"
                        value="CSS">
                    CSS
                </label>

                <label>
                    <input
                        type="checkbox"
                        name="kemampuan"
                        value="Javascript">
                    Javascript
                </label>

                <label>
                    <input
                        type="checkbox"
                        name="kemampuan"
                        value="PHP">
                    PHP
                </label>


                <label>
                    <input
                        type="checkbox"
                        name="kemampuan"
                        value="MySQL">
                    MySQL
                </label>


                <label>
                    <input
                        type="checkbox"
                        name="kemampuan"
                        value="Laravel">
                    Laravel
                </label>


                <label>
                    <input
                        type="checkbox"
                        name="kemampuan"
                        value="React Native">
                    React Native
                </label>

            </div>

        </fieldset>


        <!-- BUTTON -->
        <div class="tombol">

            <input
                type="reset"
                value="Reset">

            <input
                type="submit"
                value="Simpan">

            <input
                type="button"
                value="Button">

        </div>

    </form>

</div>

</body>
</html>
